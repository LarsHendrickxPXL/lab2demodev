name: Conditional Workflow

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Selecteer de environment'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - staging
          - production

jobs:
  run-conditional:
    runs-on: ubuntu-latest
    steps:
      - name: Toon gekozen environment
        run: echo "Gekozen environment: ${{ github.event.inputs.environment }}"

      - name: Production deployment
        if: github.event.inputs.environment == 'production'
        run: echo "Deploying to production!"

      - name: Test mode voor development of staging
        if: github.event.inputs.environment == 'development' || github.event.inputs.environment == 'staging'
        run: echo "Running in test mode"
